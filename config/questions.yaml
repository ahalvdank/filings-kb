# Candidate query traces (D8, rewritten for the pinned 12-company sample).
# Retrieval runs per (filing, item): top_k passages each; every (filing, item) group gets
# max_passages // groups of the max_passages slots, leftovers go to the best remaining scores.
# display_cutoff: passages scoring below it are not shown to the model and are exported as
# rejected candidates (included: false). It is applied before the per-filing quota and
# max_passages. The best max_rejected rejected candidates per trace are exported.
# fiscal_year is the company's own (NVDA and MSFT FY2026 end in Jan/Jun 2026).
# Avoid Item_7_MDA for CVX, JPM and XOM (one-chunk stubs incorporated by reference) and for
# INTC (not detected; its MD&A is folded into other items).
top_k: 20
max_passages: 40
max_rejected: 10
# 0.35: the score distribution has no clean valley (one hump, 0.40-0.55, with a thin left
# tail); 0.35 is where it rises steeply, and it sits below the lowest passage any answer
# cites (0.375), so no cited evidence is cut. See exports/score_distribution.txt.
display_cutoff: 0.35

